<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>REC CGPA Predictor</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="header">
      <h1>REC CGPA Predictor</h1>
      <button id="themeToggle" class="theme-btn">Toggle Theme 1</button>
    </header>
    <main class="container">
      <section class="card">
        <h2>Add Subjects</h2>
        <div id="subjectContainer"></div>
        <div class="button-group">
          <button id="addSubjectBtn">Add Subject</button>
          <button id="resetBtn">Reset</button>
        </div>
      </section>
      <section class="card sticky-card">
        <button id="calculateBtn" class="calculate-btn">Calculate CGPA</button>
        <div id="result" class="result-box">
          <p>Total Credits: <span id="totalCredits">0</span></p>
          <p>Total Grade Points: <span id="totalPoints">0</span></p>
          <h2>CGPA: <span id="cgpa">0.00</span></h2>
        </div>
      </section>
    </main>
    <footer>
      <p>Made for REC Students</p>
    </footer>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
